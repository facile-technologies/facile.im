# Local development database only. NOT used in production.
# Production uses the MySQL already installed on the Hostinger VPS.
# Start:  docker compose -f docker-compose.dev.yml up -d
# Stop:   docker compose -f docker-compose.dev.yml down   (add -v to also wipe data)
services:
  db:
    image: mysql:8
    container_name: facile-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: facilelocal
      MYSQL_DATABASE: dev_facile
    ports:
      # Host 3306 is often taken by a native MySQL/MariaDB (XAMPP/Laragon); use 3307 on the host.
      # Container still listens on 3306 internally. Set apps/api/.env.dev DB_PORT to match the host port.
      - "3307:3306"
    volumes:
      - facile_dev_dbdata:/var/lib/mysql

volumes:
  facile_dev_dbdata:
