# Production nginx server block for facile.im
# Routing:  /  -> landing (static export)   /app -> dashboard   /admin -> admin   /api -> backend :4000
# NOTE: this REPLACES the current block where the dashboard sits at "/".
#       Take a copy of the existing config before swapping. HTTPS certs already exist (Certbot).
# Install: copy to /etc/nginx/sites-available/facile, `nginx -t`, then `systemctl reload nginx`.

server {
    server_name facile.im www.facile.im;
    client_max_body_size 10m;

    # LANDING (Next.js static export) at /
    root /var/www/facile/landing;
    index index.html;

    # DASHBOARD at /app
    location = /app { return 301 /app/; }
    location /app/ {
        alias /var/www/facile/facile-web/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # ADMIN at /admin
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /var/www/facile/facile-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # BACKEND API at /api (trailing slash strips the /api prefix -> backend routes are at root)
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LANDING routing — static export emits page.html files, so try $uri.html too
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/facile.im/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/facile.im/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name facile.im www.facile.im;
    return 301 https://$host$request_uri;
}
