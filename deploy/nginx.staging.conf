# Staging nginx server block for staging.facile.im
# Same routing as prod, but under /var/www/facile-staging and backend on port 4100.
# Prereqs: DNS A-record staging -> VPS IP, then `certbot --nginx -d staging.facile.im`.
# Install: copy to /etc/nginx/sites-available/facile-staging, symlink into sites-enabled,
#          `nginx -t`, `systemctl reload nginx`.

server {
    server_name staging.facile.im;
    client_max_body_size 10m;

    # LANDING at /
    root /var/www/facile-staging/landing;
    index index.html;

    # DASHBOARD at /app
    location = /app { return 301 /app/; }
    location /app/ {
        alias /var/www/facile-staging/facile-web/dist/;
        try_files $uri $uri/ /app/index.html;
    }

    # ADMIN at /admin
    location = /admin { return 301 /admin/; }
    location /admin/ {
        alias /var/www/facile-staging/facile-admin/dist/;
        try_files $uri $uri/ /admin/index.html;
    }

    # BACKEND API at /api -> staging backend on 4100
    location /api/ {
        proxy_pass http://127.0.0.1:4100/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # LANDING routing (static export emits page.html files)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot (after certbot runs for staging.facile.im)
    # ssl_certificate ... (Certbot fills these in)
}

# HTTP -> HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name staging.facile.im;
    return 301 https://$host$request_uri;
}
